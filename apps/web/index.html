<!doctype html>
<html lang="en">
  <head>
    <script>
      // Runs before first paint to avoid a flash of the wrong theme.
      // Keep the storage key in sync with useTheme.ts.
      (function () {
        var saved = localStorage.getItem('showbrowse-theme');
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ShowBrowse is a Netflix-style TV show browser. Discover, search, and explore TV shows with ratings, genres, and more."
    />
    <meta property="og:title" content="ShowBrowse — Discover TV Shows" />
    <meta
      property="og:description"
      content="Browse, search, and explore TV shows. Find ratings, genres, and cast information."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nx-showbrowse.vercel.app" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShowBrowse — Discover TV Shows" />
    <meta
      name="twitter:description"
      content="Browse, search, and explore TV shows. Find ratings, genres, and cast information."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="canonical" href="https://nx-showbrowse.vercel.app" />
    <title>ShowBrowse — Discover TV Shows</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
