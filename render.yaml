services:
  - type: web
    name: showbrowse-api
    runtime: node
    plan: free
    autoDeploy: false # deploys are triggered explicitly by .github/workflows/deploy.yml, gated on `nx affected`
    buildCommand: npm ci --include=dev
    startCommand: npx tsx --tsconfig apps/api/tsconfig.json apps/api/src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TVMAZE_BASE_URL
        value: https://api.tvmaze.com
      - key: SYNC_CRON_SCHEDULE
        value: 0 3 * * *
      - key: REQUESTS_PER_SECOND
        value: 1.8
